version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: spk-ahp-topsis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spk_ahp_topsis
      POSTGRES_USER: spk_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMeImmediate123!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spk_admin -d spk_ahp_topsis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    name: spk-ahp-topsis-pgdata
